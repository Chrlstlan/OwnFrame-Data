name: UI translation fix
description: A UI string (button, label, hint) is wrong or awkward in your language.
labels: ["i18n"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - de
        - en
        - es
        - fr
        - it
        - ja
        - ko
        - pl
        - pt
        - ru
        - tc
        - th
        - tr
        - uk
        - zh
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: String key (if known)
      description: The key in i18n/locales/<lang>/ui.json — leave empty if you don't know it.
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested text
      description: Why the suggestion is better (in-game term, grammar, tone) helps the review.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Tip: translation fixes are even better as a pull request against
        `i18n/locales/<lang>/ui.json` — see [CONTRIBUTING.md](../../CONTRIBUTING.md).